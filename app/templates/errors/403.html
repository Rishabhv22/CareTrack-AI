{% extends 'base.html' %}

{% block title %}Access Denied - CareTrack AI{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5 animated-fade-in">
    <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle mb-4" style="width: 80px; height: 80px;">
        <i class="bi bi-shield-slash-fill fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold mb-3">Access Denied</h1>
    <p class="lead text-muted mb-4">You do not have permission to access this resource. Please make sure you are logged in with the correct role.</p>
    <a href="{{ url_for('index') }}" class="btn btn-teal rounded-pill px-4 py-2 fw-semibold">
        <i class="bi bi-house-door-fill me-1"></i> Return Home
    </a>
</div>
{% endblock %}
